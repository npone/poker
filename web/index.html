<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold'em</title>
<meta name="description" content="No-Limit Texas Hold'em against bots.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/michroma@5.3.0/files/michroma-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<main id="app">
  <header class="bar">
    <div class="brand">
      <a class="home" href="https://npone.dev" title="Back to npone.dev">np<span class="one">one</span></a><span class="slash" aria-hidden="true">/</span>
      <h1><span class="suit-chip" aria-hidden="true">♠</span><span class="word">Hold'em</span><span class="tag">no-limit · vs bots</span></h1>
    </div>
    <span id="hand-info" class="muted"></span>
    <span class="sound">
      <label class="switch" title="Sound effects (M)">
        <input id="sound-toggle" type="checkbox" checked><span class="track" aria-hidden="true"></span>Sound
      </label>
      <input id="volume" type="range" min="0" max="100" step="1" value="60" aria-label="Volume" title="Volume">
    </span>
    <label class="switch" title="Show pot odds and your equity on your turn (O)">
      <input id="odds-toggle" type="checkbox"><span class="track" aria-hidden="true"></span>Odds helper
    </label>
    <label class="setting" title="Pause between hands before the next one deals itself">Next hand
      <select id="next-secs">
        <option value="2">after 2 s</option><option value="4">after 4 s</option>
        <option value="7">after 7 s</option><option value="12">after 12 s</option>
        <option value="0">when I click</option>
      </select></label>
    <button id="new-game" class="ghost" type="button">New game</button>
  </header>

  <section id="setup" class="card-panel" hidden>
    <h2>New table</h2>
    <form id="setup-form">
      <label>Players (incl. you)
        <input name="players" type="number" min="2" max="8" value="4" required></label>
      <label>Starting stack
        <input name="stack" type="number" min="10" max="1000000" value="100" required></label>
      <label>Small blind
        <input name="sb" type="number" min="1" value="1" required></label>
      <label>Big blind
        <input name="bb" type="number" min="1" value="2" required></label>
      <button type="submit" class="primary">Sit down</button>
      <p id="setup-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="table-view" hidden>
    <div class="table-wrap">
     <div class="main-col">
      <div id="felt" class="felt">
        <div class="center">
          <div id="board" class="board" aria-label="Board"></div>
          <div id="pot" class="pot"><span class="chip-ico" aria-hidden="true"></span><span id="pot-amt"></span></div>
        </div>
        <div id="bets"></div>
        <div id="dealer" class="dealer" hidden>D</div>
        <div id="seats"></div>
        <div id="fx" class="fx" aria-hidden="true"></div>
        <div id="winner" class="winner-overlay" role="status" aria-live="polite" hidden>
          <div class="win-card">
            <div id="win-title" class="win-title"></div>
            <ol id="win-pots" class="win-pots"></ol>
            <div id="win-net" class="win-net"></div>
            <div id="next" class="next">
              <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle cx="18" cy="18" r="16" class="ring-bg"/><circle id="next-ring" cx="18" cy="18" r="16" class="ring-fg"/>
              </svg>
              <span id="next-label">Next hand…</span>
              <button id="btn-now" class="primary small" type="button">Deal now</button>
              <button id="btn-hold" class="small" type="button">Hold</button>
            </div>
            <button id="btn-again" class="primary" type="button" hidden>Play again</button>
            <button id="btn-replay" class="link" type="button">↺ Replay this hand</button>
          </div>
        </div>
      </div>

    <div id="controls" class="controls">
      <div id="actions" class="actions" hidden>
        <button id="btn-fold" class="danger" type="button">Fold <kbd>F</kbd></button>
        <button id="btn-call" class="primary" type="button">Check <kbd>C</kbd></button>
        <div id="raise-group" class="raise-group">
          <input id="raise-range" type="range" aria-label="Raise amount">
          <input id="raise-amount" type="number" inputmode="numeric" aria-label="Raise to">
          <div class="presets">
            <button type="button" data-preset="half">½ pot</button>
            <button type="button" data-preset="pot">Pot</button>
            <button type="button" data-preset="max">Max</button>
          </div>
          <button id="btn-raise" class="accent" type="button">Raise <kbd>R</kbd></button>
        </div>
        <button id="btn-allin" class="accent" type="button">All-in <kbd>A</kbd></button>
      </div>
      <div id="between" class="between" hidden>
        <button id="btn-deal" class="primary" type="button">Deal first hand <kbd>Space</kbd></button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </div>
     </div>

     <!-- fixed side column: the table never moves when the odds helper turns on or off -->
     <div class="side">
      <aside id="odds" class="odds-panel" hidden aria-live="polite">
        <h3>Odds helper</h3>
        <div id="odds-body"></div>
      </aside>
      <button id="btn-history" type="button" disabled>Hand history <kbd>H</kbd></button>
      <details id="log-box" class="log-box" open>
        <summary>Hand log</summary>
        <ol id="log"></ol>
      </details>
     </div>
    </div>
  </section>

  <dialog id="history" class="history" aria-labelledby="hist-title">
    <div class="hist-head">
      <h2 id="hist-title">Hand history</h2>
      <select id="hist-pick" aria-label="Choose a hand"></select>
      <button id="hist-close" class="small" type="button">Close <kbd>Esc</kbd></button>
    </div>
    <div class="hist-body">
      <div class="hist-stage">
        <div class="hist-felt">
          <div id="hist-board" class="board" aria-label="Board"></div>
          <div id="hist-pot" class="pot show"><span class="chip-ico" aria-hidden="true"></span><span></span></div>
        </div>
        <div id="hist-seats" class="hist-seats"></div>
        <p id="hist-caption" class="hist-caption" aria-live="polite"></p>
        <div class="hist-controls">
          <button id="hist-first" class="small" type="button" title="Start (Home)" aria-label="Start">⏮</button>
          <button id="hist-prev" class="small" type="button" title="Back (←)" aria-label="Back">◀</button>
          <button id="hist-play" class="small primary" type="button" title="Play / pause (Space)">▶ Play</button>
          <button id="hist-next" class="small" type="button" title="Forward (→)" aria-label="Forward">▶</button>
          <button id="hist-last" class="small" type="button" title="End (End)" aria-label="End">⏭</button>
          <input id="hist-scrub" type="range" min="0" value="0" aria-label="Step through the hand">
        </div>
      </div>
      <ol id="hist-steps" class="hist-steps"></ol>
    </div>
  </dialog>
</main>
<script src="app.js?v=8"></script>
</body>
</html>
