<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold'em</title>
<meta name="description" content="No-Limit Texas Hold'em against bots.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="bar">
    <h1>♠ Hold'em</h1>
    <span id="hand-info" class="muted"></span>
    <label class="switch" title="Show pot odds and your equity on your turn (O)">
      <input id="odds-toggle" type="checkbox"><span class="track" aria-hidden="true"></span>Odds helper
    </label>
    <button id="new-game" class="ghost" type="button">New game</button>
  </header>

  <section id="setup" class="card-panel" hidden>
    <h2>New table</h2>
    <form id="setup-form">
      <label>Players (incl. you)
        <input name="players" type="number" min="2" max="8" value="4" required></label>
      <label>Starting stack
        <input name="stack" type="number" min="10" max="1000000" value="100" required></label>
      <label>Small blind
        <input name="sb" type="number" min="1" value="1" required></label>
      <label>Big blind
        <input name="bb" type="number" min="1" value="2" required></label>
      <button type="submit" class="primary">Sit down</button>
      <p id="setup-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="table-view" hidden>
    <div class="table-wrap">
      <div id="felt" class="felt">
        <div class="center">
          <div id="board" class="board" aria-label="Board"></div>
          <div id="pot" class="pot"><span class="chip-ico" aria-hidden="true"></span><span id="pot-amt"></span></div>
        </div>
        <div id="bets"></div>
        <div id="dealer" class="dealer" hidden>D</div>
        <div id="seats"></div>
        <div id="fx" class="fx" aria-hidden="true"></div>
        <div id="winner" class="winner-overlay" role="status" aria-live="polite" hidden>
          <div class="win-card">
            <div id="win-title" class="win-title"></div>
            <ol id="win-pots" class="win-pots"></ol>
            <div id="win-net" class="win-net"></div>
            <div id="next" class="next">
              <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle cx="18" cy="18" r="16" class="ring-bg"/><circle id="next-ring" cx="18" cy="18" r="16" class="ring-fg"/>
              </svg>
              <span id="next-label">Next hand…</span>
              <button id="btn-now" class="primary small" type="button">Deal now</button>
              <button id="btn-hold" class="small" type="button">Hold</button>
            </div>
            <button id="btn-again" class="primary" type="button" hidden>Play again</button>
          </div>
        </div>
      </div>

      <aside id="odds" class="odds-panel" hidden aria-live="polite">
        <h3>Odds helper</h3>
        <div id="odds-body"></div>
      </aside>
    </div>

    <div id="controls" class="controls">
      <div id="actions" class="actions" hidden>
        <button id="btn-fold" class="danger" type="button">Fold <kbd>F</kbd></button>
        <button id="btn-call" class="primary" type="button">Check <kbd>C</kbd></button>
        <div id="raise-group" class="raise-group">
          <input id="raise-range" type="range" aria-label="Raise amount">
          <input id="raise-amount" type="number" inputmode="numeric" aria-label="Raise to">
          <div class="presets">
            <button type="button" data-preset="half">½ pot</button>
            <button type="button" data-preset="pot">Pot</button>
            <button type="button" data-preset="max">Max</button>
          </div>
          <button id="btn-raise" class="accent" type="button">Raise <kbd>R</kbd></button>
        </div>
        <button id="btn-allin" class="accent" type="button">All-in <kbd>A</kbd></button>
      </div>
      <div id="between" class="between" hidden>
        <button id="btn-deal" class="primary" type="button">Deal first hand <kbd>Space</kbd></button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </div>

    <details id="log-box" class="log-box">
      <summary>Hand log</summary>
      <ol id="log"></ol>
    </details>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
